[project]
name = "al-farganiy-academy"
version = "1.0.0"
description = "Al-Farg'oniy Academy CRM REST API & Dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.9.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
